[package]
name              = "session-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
anyhow      = { workspace = true }
mycelium-types    = { workspace = true }
uuid        = { workspace = true }

[package.metadata.component]
package = "mycelium:session-bridge"

[package.metadata.component.target]
path  = "wit"
world = "session-bridge"

[package.metadata.component.target.dependencies]
"wasi:keyvalue" = { path = "wit/deps/wasi-keyvalue-0.2.0-draft" }
"wasi:logging" = { path = "wit/deps/wasi-logging-0.1.0-draft" }
"wasi:clocks" = { path = "wit/deps/wasi-clocks-0.2.2" }
"wasi:random" = { path = "wit/deps/wasi-random-0.2.2" }
"wasmcloud:messaging" = { path = "wit/deps/wasmcloud-messaging-0.2.0" }
"mycelium:types" = { path = "wit/deps/mycelium-types-0.1.0" }
"wasi:io" = { path = "wit/deps/wasi-io-0.2.2" }
"mycelium:pairing" = { path = "wit/deps/mycelium-pairing-0.1.0" }
