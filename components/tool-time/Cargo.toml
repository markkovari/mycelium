[package]
name              = "tool-time"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }

[package.metadata.component]
package = "mycelium:tool-time"

[package.metadata.component.target]
path  = "wit"
world = "tool-time"

[package.metadata.component.target.dependencies]
"wasi:clocks"    = { path = "wit/deps/wasi-clocks-0.2.2" }
"wasi:io"        = { path = "wit/deps/wasi-io-0.2.2" }
"mycelium:types" = { path = "wit/deps/mycelium-types-0.1.0" }
"mycelium:tool"  = { path = "wit/deps/mycelium-tool-0.1.0" }
