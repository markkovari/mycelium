name: Build and push WASM components

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'components/**'
      - 'crates/**'
      - 'wit/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/release.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/mycelium

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component:
          # Only sandboxed skill components remain wasm. The trusted
          # pipeline ships as native binaries via .github/workflows/native.yaml.
          - { dir: tool-time,      file: tool_time }
          - { dir: tool-calc,      file: tool_calc }
          - { dir: tool-web-fetch, file: tool_web_fetch }
          - { dir: hook-trace,     file: hook_trace }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install wash 2.x
        uses: wasmcloud/setup-wash-action@v2.1.0

      - name: Install cargo-component
        run: cargo install --locked cargo-component

      - name: Install wkg
        run: cargo install --locked wkg

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Resolve version tag
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "extra=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "extra=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Lowercase image prefix
        id: prefix
        run: echo "value=$(echo '${{ env.IMAGE_PREFIX }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Init WIT deps
        run: just init-wit-deps

      - name: Build component
        working-directory: components/${{ matrix.component.dir }}
        run: cargo component build --target wasm32-wasip2 --release

      - name: Login to ghcr.io
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 4
          retry_wait_seconds: 15
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

      - name: Push component
        run: |
          WASM=target/wasm32-wasip2/release/${{ matrix.component.file }}.wasm
          BASE=${{ steps.prefix.outputs.value }}/${{ matrix.component.dir }}
          wash oci push "${BASE}:${{ steps.ver.outputs.tag }}" "$WASM"
          wash oci push "${BASE}:${{ steps.ver.outputs.extra }}" "$WASM"
