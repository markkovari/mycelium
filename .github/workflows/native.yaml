name: Build native binaries (aarch64 / x86_64)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'crates/mycelium-core/**'
      - 'crates/mycelium-tool-runner/**'
      - 'crates/mycelium-types/**'
      - 'crates/mycelium-agent-core/**'
      - 'crates/mycelium-tool-core/**'
      - 'crates/mycelium-wasm-host/**'
      - 'crates/mycelium-hook-runner/**'
      - 'components/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
        binary:
          - mycelium-core
          - mycelium-tool-runner
          - mycelium-hook-runner

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build ${{ matrix.binary }}
        run: cargo build --release --target ${{ matrix.target }} -p ${{ matrix.binary }}

      - name: Resolve version tag
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        run: |
          ARTIFACT="${{ matrix.binary }}-${{ steps.ver.outputs.tag }}-${{ matrix.target }}.tar.gz"
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          tar -C "$(dirname "$BIN_PATH")" -czf "$ARTIFACT" "$(basename "$BIN_PATH")"
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
        id: pack

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: |
            ${{ steps.pack.outputs.artifact }}
            ${{ steps.pack.outputs.artifact }}.sha256
          retention-days: 14

      - name: Attach to release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pack.outputs.artifact }}
            ${{ steps.pack.outputs.artifact }}.sha256

  build-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - mcp-demo
          - mcp-todo
          - tool-time
          - tool-calc
          - tool-web-fetch
          - hook-trace

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install cargo-component + wkg
        run: cargo install cargo-component wkg --locked

      - name: Seed WIT deps
        run: |
          # Fetch external WASI packages into wit/deps/
          tmpdir=$(mktemp -d)
          mkdir -p "$tmpdir/deps"
          cp wit/deps.toml "$tmpdir/deps.toml"
          cp infra/fetch-world.wit "$tmpdir/world.wit"
          wkg wit fetch -d "$tmpdir"
          mkdir -p wit/deps
          cp -r "$tmpdir/deps/." wit/deps/
          # Overlay hand-maintained packages
          [ -d wit/local-deps ] && cp -R wit/local-deps/. wit/deps/
          # Seed each component's wit/deps/ from workspace
          for comp in components/*/; do
            dest="${comp}wit/deps"
            mkdir -p "$dest"
            cp -r wit/deps/. "$dest/"
            for pkg in types agent conversation tool memory executor router channel pairing cron batch task hook mcp; do
              mkdir -p "$dest/mycelium-${pkg}-0.1.0"
              [ -f "wit/${pkg}.wit" ] && cp "wit/${pkg}.wit" "$dest/mycelium-${pkg}-0.1.0/"
            done
          done

      - name: Build ${{ matrix.component }}
        run: cargo component build --release -p ${{ matrix.component }}

      - name: Resolve version tag
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        id: pack
        run: |
          COMP="${{ matrix.component }}"
          FILE="${COMP//-/_}.wasm"
          ARTIFACT="${COMP}-${{ steps.ver.outputs.tag }}.wasm"
          cp "target/wasm32-wasip1/release/$FILE" "$ARTIFACT"
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: |
            ${{ steps.pack.outputs.artifact }}
            ${{ steps.pack.outputs.artifact }}.sha256
          retention-days: 14

      - name: Attach to release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pack.outputs.artifact }}
            ${{ steps.pack.outputs.artifact }}.sha256
