apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: mycelium-dev
  annotations:
    description: |
      Dev environment. Anthropic claude-3-5-haiku. External NATS at dev-nats.internal:4222.
      Agents run x4 replicas. OCI images from ghcr.io/markkovari/mycelium.
    version: v0.1.0
spec:
  components:
    - name: gateway
      type: component
      properties:
        image: ghcr.io/markkovari/mycelium/gateway:latest
      traits:
        - type: spreadscaler
          properties:
            instances: 2

    - name: executor
      type: component
      properties:
        image: ghcr.io/markkovari/mycelium/executor:latest
      traits:
        - type: spreadscaler
          properties:
            instances: 4

    - name: agent
      type: component
      properties:
        image: ghcr.io/markkovari/mycelium/agent:latest
      traits:
        - type: spreadscaler
          properties:
            instances: 8

    - name: tool-runner
      type: component
      properties:
        image: ghcr.io/markkovari/mycelium/tool-runner:latest
      traits:
        - type: spreadscaler
          properties:
            instances: 4

    - name: memory-store
      type: component
      properties:
        image: ghcr.io/markkovari/mycelium/memory-store:latest
      traits:
        - type: spreadscaler
          properties:
            instances: 2

    - name: conversation-store
      type: component
      properties:
        image: ghcr.io/markkovari/mycelium/conversation-store:latest
      traits:
        - type: spreadscaler
          properties:
            instances: 2

    - name: router
      type: component
      properties:
        image: ghcr.io/markkovari/mycelium/router:latest
      traits:
        - type: spreadscaler
          properties:
            instances: 2

    - name: event-logger
      type: component
      properties:
        image: ghcr.io/markkovari/mycelium/event-logger:latest
      traits:
        - type: spreadscaler
          properties:
            instances: 1

    - name: telegram-gateway
      type: component
      properties:
        image: ghcr.io/markkovari/mycelium/telegram-gateway:latest
      traits:
        - type: spreadscaler
          properties:
            instances: 2

    - name: session-bridge
      type: component
      properties:
        image: ghcr.io/markkovari/mycelium/session-bridge:latest
      traits:
        - type: spreadscaler
          properties:
            instances: 2

    - name: httpserver
      type: capability
      properties:
        image: ghcr.io/wasmcloud/http-server:0.26.0
      traits:
        - type: link
          properties:
            target: gateway
            namespace: wasi
            package: http
            interfaces: [incoming-handler]
            source_config:
              - name: gateway-http-config
                properties:
                  address: "0.0.0.0:8080"
        - type: link
          properties:
            target: telegram-gateway
            namespace: wasi
            package: http
            interfaces: [incoming-handler]
            source_config:
              - name: telegram-http-config
                properties:
                  address: "0.0.0.0:8081"

    - name: http-client
      type: capability
      properties:
        image: ghcr.io/wasmcloud/http-client:0.12.0
      traits:
        - type: link
          properties:
            target: agent
            namespace: wasi
            package: http
            interfaces: [outgoing-handler]
        - type: link
          properties:
            target: tool-runner
            namespace: wasi
            package: http
            interfaces: [outgoing-handler]
        - type: link
          properties:
            target: telegram-gateway
            namespace: wasi
            package: http
            interfaces: [outgoing-handler]

    - name: keyvalue-nats
      type: capability
      properties:
        image: ghcr.io/wasmcloud/keyvalue-nats:0.24.0
      traits:
        - type: link
          properties:
            target: memory-store
            namespace: wasi
            package: keyvalue
            interfaces: [store, atomics]
            target_config:
              - name: lc-kv-memory
                properties:
                  bucket: lc-memory
        - type: link
          properties:
            target: conversation-store
            namespace: wasi
            package: keyvalue
            interfaces: [store]
            target_config:
              - name: lc-kv-conversations
                properties:
                  bucket: lc-conversations
        - type: link
          properties:
            target: session-bridge
            namespace: wasi
            package: keyvalue
            interfaces: [store, atomics]
            target_config:
              - name: lc-kv-sessions
                properties:
                  bucket: lc-channel-sessions

    - name: messaging-nats
      type: capability
      properties:
        image: ghcr.io/wasmcloud/messaging-nats:0.24.0
      traits:
        - type: link
          properties:
            target: executor
            namespace: wasmcloud
            package: messaging
            interfaces: [handler, producer]
            source_config:
              - name: nats-dev
                properties:
                  cluster_uris: "nats://dev-nats.internal:4222"
                  subscriptions: "lc.task.submit,lc.step.result"
        - type: link
          properties:
            target: agent
            namespace: wasmcloud
            package: messaging
            interfaces: [handler, producer]
            source_config:
              - name: nats-dev
                properties:
                  cluster_uris: "nats://dev-nats.internal:4222"
                  subscriptions: "lc.task.step.agent,lc.tool.result"
        - type: link
          properties:
            target: session-bridge
            namespace: wasmcloud
            package: messaging
            interfaces: [handler]
            source_config:
              - name: nats-dev
                properties:
                  cluster_uris: "nats://dev-nats.internal:4222"
                  subscriptions: "lc.pair.>"
        - type: link
          properties:
            target: telegram-gateway
            namespace: wasmcloud
            package: messaging
            interfaces: [handler, producer]
            source_config:
              - name: nats-dev
                properties:
                  cluster_uris: "nats://dev-nats.internal:4222"
                  subscriptions: "lc.channel.telegram.out.>"
