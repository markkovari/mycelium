apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: mycelium-local
  annotations:
    description: |
      Local dev. Ollama at localhost:11434. NATS at localhost:4222 (embedded).
      HTTP on :8080. No TLS. All instances = 1.
    version: v0.3.0
spec:
  components:

    # ── WASM Components ─────────────────────────────────────────────────────

    - name: gateway
      type: component
      properties:
        image: file:///Users/markkovari/DEV/markkovari/mycelium/target/wasm32-wasip2/release/gateway.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        - type: config
          properties:
            name: gateway-kv-config
            properties:
              bucket: mycelium-conversations

    - name: executor
      type: component
      properties:
        image: file:///Users/markkovari/DEV/markkovari/mycelium/target/wasm32-wasip2/release/executor.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 2
        - type: config
          properties:
            name: executor-kv-config
            properties:
              bucket: mycelium-task-state

    - name: agent
      type: component
      properties:
        image: file:///Users/markkovari/DEV/markkovari/mycelium/target/wasm32-wasip2/release/agent.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 4

    - name: tool-runner
      type: component
      properties:
        image: file:///Users/markkovari/DEV/markkovari/mycelium/target/wasm32-wasip2/release/tool_runner.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 2

    - name: memory-store
      type: component
      properties:
        image: file:///Users/markkovari/DEV/markkovari/mycelium/target/wasm32-wasip2/release/memory_store.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        - type: config
          properties:
            name: memory-store-kv-config
            properties:
              bucket: mycelium-memory

    - name: conversation-store
      type: component
      properties:
        image: file:///Users/markkovari/DEV/markkovari/mycelium/target/wasm32-wasip2/release/conversation_store.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        - type: config
          properties:
            name: conversation-store-kv-config
            properties:
              bucket: mycelium-conversations

    - name: router
      type: component
      properties:
        image: file:///Users/markkovari/DEV/markkovari/mycelium/target/wasm32-wasip2/release/router.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        - type: config
          properties:
            name: router-kv-config
            properties:
              bucket: mycelium-router-rules

    - name: event-logger
      type: component
      properties:
        image: file:///Users/markkovari/DEV/markkovari/mycelium/target/wasm32-wasip2/release/event_logger.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        - type: config
          properties:
            name: event-logger-kv-config
            properties:
              bucket: mycelium-events-journal

    - name: telegram-gateway
      type: component
      properties:
        image: file:///Users/markkovari/DEV/markkovari/mycelium/target/wasm32-wasip2/release/telegram_gateway.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        - type: config
          properties:
            name: telegram-gateway-kv-config
            properties:
              bucket: mycelium-channel-sessions

    - name: session-bridge
      type: component
      properties:
        image: file:///Users/markkovari/DEV/markkovari/mycelium/target/wasm32-wasip2/release/session_bridge.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        - type: config
          properties:
            name: session-bridge-kv-config
            properties:
              bucket: mycelium-channel-sessions

    # ── Capability Providers ─────────────────────────────────────────────────

    - name: httpserver-gateway
      type: capability
      properties:
        image: ghcr.io/wasmcloud/http-server:0.26.0
      traits:
        - type: link
          properties:
            target: gateway
            namespace: wasi
            package: http
            interfaces: [incoming-handler]
            source_config:
              - name: gateway-http-config
                properties:
                  address: "0.0.0.0:8080"

    - name: httpserver-telegram
      type: capability
      properties:
        image: ghcr.io/wasmcloud/http-server:0.26.0
      traits:
        - type: link
          properties:
            target: telegram-gateway
            namespace: wasi
            package: http
            interfaces: [incoming-handler]
            source_config:
              - name: telegram-http-config
                properties:
                  address: "0.0.0.0:8081"

    # wasi:http/outgoing-handler and wasi:keyvalue are provided by the wasmCloud host plugin (v2).
    # No provider entry needed. Components open buckets via wasi:config at runtime.

    - name: messaging-nats
      type: capability
      properties:
        image: ghcr.io/wasmcloud/messaging-nats:0.24.0
      traits:
        - type: link
          properties:
            name: messaging-gateway
            target: gateway
            namespace: wasmcloud
            package: messaging
            interfaces: [producer]
            source_config:
              - name: nats-local-gateway
                properties:
                  cluster_uris: "nats://127.0.0.1:4222"
        - type: link
          properties:
            name: messaging-executor
            target: executor
            namespace: wasmcloud
            package: messaging
            interfaces: [handler, producer]
            source_config:
              - name: nats-local-executor
                properties:
                  cluster_uris: "nats://127.0.0.1:4222"
                  subscriptions: "mycelium.task.submit,mycelium.step.result"
        - type: link
          properties:
            name: messaging-agent
            target: agent
            namespace: wasmcloud
            package: messaging
            interfaces: [handler, producer]
            source_config:
              - name: nats-local-agent
                properties:
                  cluster_uris: "nats://127.0.0.1:4222"
                  subscriptions: "mycelium.task.step.agent,mycelium.tool.result"
        - type: link
          properties:
            name: messaging-tool-runner
            target: tool-runner
            namespace: wasmcloud
            package: messaging
            interfaces: [handler, producer]
            source_config:
              - name: nats-local-tool-runner
                properties:
                  cluster_uris: "nats://127.0.0.1:4222"
                  subscriptions: "mycelium.tool.call"
        - type: link
          properties:
            name: messaging-memory-store
            target: memory-store
            namespace: wasmcloud
            package: messaging
            interfaces: [handler]
            source_config:
              - name: nats-local-memory-store
                properties:
                  cluster_uris: "nats://127.0.0.1:4222"
                  subscriptions: "mycelium.memory.>"
        - type: link
          properties:
            name: messaging-conversation-store
            target: conversation-store
            namespace: wasmcloud
            package: messaging
            interfaces: [handler]
            source_config:
              - name: nats-local-conversation-store
                properties:
                  cluster_uris: "nats://127.0.0.1:4222"
                  subscriptions: "mycelium.conversation.>"
        - type: link
          properties:
            name: messaging-router
            target: router
            namespace: wasmcloud
            package: messaging
            interfaces: [handler, producer]
            source_config:
              - name: nats-local-router
                properties:
                  cluster_uris: "nats://127.0.0.1:4222"
                  subscriptions: "mycelium.event.>"
        - type: link
          properties:
            name: messaging-event-logger
            target: event-logger
            namespace: wasmcloud
            package: messaging
            interfaces: [handler]
            source_config:
              - name: nats-local-event-logger
                properties:
                  cluster_uris: "nats://127.0.0.1:4222"
                  subscriptions: "mycelium.event.>"
        - type: link
          properties:
            name: messaging-telegram
            target: telegram-gateway
            namespace: wasmcloud
            package: messaging
            interfaces: [handler, producer]
            source_config:
              - name: nats-local-telegram
                properties:
                  cluster_uris: "nats://127.0.0.1:4222"
                  subscriptions: "mycelium.channel.telegram.out.>"
        - type: link
          properties:
            name: messaging-session-bridge
            target: session-bridge
            namespace: wasmcloud
            package: messaging
            interfaces: [handler]
            source_config:
              - name: nats-local-session-bridge
                properties:
                  cluster_uris: "nats://127.0.0.1:4222"
                  subscriptions: "mycelium.pair.>"
