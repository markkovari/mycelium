[workspace]
resolver = "2"
members = [
    # Sandboxed skill components (wasm32-wasip2; loaded into mycelium-tool-runner).
    "components/tool-time",
    "components/tool-calc",
    "components/tool-web-fetch",
    # Native pipeline + tool runner + shared crates.
    "crates/mycelium-core",
    "crates/mycelium-tool-runner",
    "crates/mycelium-hook-runner",
    "crates/mycelium-types",
    "crates/mycelium-agent-core",
    "crates/mycelium-tool-core",
    "crates/mycelium-cli",
    "crates/mycelium-tests",
    "crates/mycelium-wasm-host",
]

# `cargo build` (no -p) targets only the native crates. Skill components live
# in the workspace for shared dep resolution but must be built with
# cargo-component (`just build`) because they target wasm32-wasip2.
default-members = [
    "crates/mycelium-core",
    "crates/mycelium-tool-runner",
    "crates/mycelium-hook-runner",
    "crates/mycelium-types",
    "crates/mycelium-agent-core",
    "crates/mycelium-tool-core",
    "crates/mycelium-cli",
    "crates/mycelium-tests",
    "crates/mycelium-wasm-host",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "Apache-2.0"
repository = "https://github.com/markkovari/mycelium"

[workspace.dependencies]
wit-bindgen         = "0.41.0"
wit-bindgen-rt      = "0.41.0"
wstd                = "0.6"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
anyhow              = "1"
uuid                = { version = "1", features = ["v4", "v7"] }
async-nats          = "0.38"
futures-util        = "0.3"
tokio               = { version = "1", features = ["full"] }
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
clap                = { version = "4", features = ["derive", "env"] }
rustyline           = "14"
mycelium-types            = { path = "crates/mycelium-types" }
mycelium-agent-core       = { path = "crates/mycelium-agent-core" }
mycelium-tool-core        = { path = "crates/mycelium-tool-core" }
mycelium-wasm-host        = { path = "crates/mycelium-wasm-host" }
reqwest                   = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "stream"] }
chrono                    = { version = "0.4", features = ["serde", "clock"] }
thiserror                 = "2"
bytes                     = "1"
toml                      = "0.8"
dotenvy                   = "0.15"
axum                      = "0.7"
tower                     = { version = "0.5", features = ["util"] }
tower-http                = { version = "0.6", features = ["trace", "cors"] }
wasmtime                  = { version = "27", default-features = false, features = ["component-model", "async", "cache", "cranelift", "parallel-compilation", "pooling-allocator", "runtime"] }
wasmtime-wasi             = "27"
wasmtime-wasi-http        = "27"
oci-distribution          = { version = "0.11", default-features = false, features = ["rustls-tls"] }
sha2                      = "0.10"
hex                       = "0.4"

[profile.release]
opt-level     = "z"
lto           = true
strip         = true
codegen-units = 1
panic         = "abort"
