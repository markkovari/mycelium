# Embedded NATS server config for local dev.
# Used by wash up (wasmCloud embeds NATS by default on port 4222).

port: 4222
http_port: 8222

jetstream {
  domain: default
  store_dir: /tmp/mycelium-nats
  max_memory_store: 512MB
  max_file_store:   2GB
}

# Allow all connections without auth in local dev
# (add nkeys/jwt for dev/prod)
